name: Release T3 Code Leo

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable Leo version (for example 0.1.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-t3-code-leo
  cancel-in-progress: false

jobs:
  checks:
    if: github.repository == 'leo7111/t3code-leo'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
      - name: Install Chromium for dictation regression tests
        run: node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium
      - name: Test packaging and update behavior
        run: vp test run scripts/build-desktop-artifact.test.ts scripts/verify-leo-release.test.ts apps/desktop/src/updates/DesktopUpdates.test.ts apps/desktop/src/updates/updateMachine.test.ts
      - name: Test dictation lifecycle and recovery
        run: vp test run packages/client-runtime/src/voice-input/controller.test.ts apps/web/src/voice/availability.test.ts apps/web/src/voice/browserVoiceRecorder.test.ts apps/web/src/voice/useComposerVoiceInput.browser.test.tsx apps/web/src/components/settings/settingsSearch.test.ts apps/web/src/components/settings/VoiceTranscriptionSettings.browser.test.tsx

  build:
    needs: checks
    if: github.repository == 'leo7111/t3code-leo'
    runs-on: windows-2025
    env:
      LEO_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate version and release target
        uses: actions/github-script@v8
        with:
          script: |
            const version = process.env.LEO_VERSION;
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
              throw new Error('A stable semantic version is required.');
            }
            for (const request of [
              () => github.rest.repos.getReleaseByTag({...context.repo, tag: `v${version}`}),
              () => github.rest.git.getRef({...context.repo, ref: `tags/v${version}`}),
            ]) {
              try { await request(); }
              catch (error) { if (error.status === 404) continue; throw error; }
              throw new Error(`v${version} already exists; choose a new version.`);
            }
            let latest;
            try { latest = (await github.rest.repos.getLatestRelease(context.repo)).data; }
            catch (error) { if (error.status !== 404) throw error; }
            if (latest) {
              const previous = latest.tag_name.replace(/^v/, '');
              if (!/^\d+\.\d+\.\d+$/.test(previous)) throw new Error('Review the current latest release tag.');
              const incoming = version.split('.').map(BigInt);
              const current = previous.split('.').map(BigInt);
              const index = incoming.findIndex((part, position) => part !== current[position]);
              if (index < 0 || incoming[index] < current[index]) throw new Error('Release version must increase.');
            }
      - uses: ./.github/actions/setup-ci-deps
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: Test Leo packaging and update behavior
        shell: bash
        run: |
          vp test run scripts/build-desktop-artifact.test.ts -t Leo
          vp test run scripts/verify-leo-release.test.ts apps/desktop/src/updates/updateMachine.test.ts
      - name: Build Windows x64 installer
        shell: pwsh
        run: node scripts/build-leo-desktop.mjs --build-version "$env:LEO_VERSION"
      - name: Verify release manifests and checksums
        shell: pwsh
        run: node scripts/verify-leo-release.ts --directory release/leo --version "$env:LEO_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: leo-windows-x64
          if-no-files-found: error
          path: |
            release/leo/T3-Code-Leo-${{ inputs.version }}-x64.exe
            release/leo/T3-Code-Leo-${{ inputs.version }}-x64.exe.blockmap
            release/leo/latest.yml
            release/leo/SHA256SUMS.txt

  draft-release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      LEO_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: leo-windows-x64
          path: release
      - name: Create a draft only
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum --check --strict SHA256SUMS.txt
          printf 'Windows x64 release from commit %s.\n\nUpdates require explicit download and install. This installer is unsigned; SHA256SUMS.txt is integrity evidence, not a signing certificate.\n\nReview this draft and publish it as the latest stable release only when ready.\n' "$GITHUB_SHA" > release-notes.txt
          gh release create "v$LEO_VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "T3 Code Leo $LEO_VERSION" --notes-file release-notes.txt "T3-Code-Leo-$LEO_VERSION-x64.exe" "T3-Code-Leo-$LEO_VERSION-x64.exe.blockmap" latest.yml SHA256SUMS.txt
